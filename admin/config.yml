backend:
  name: git-gateway
  branch: main

media_folder: "img/uploads"
public_folder: "/img/uploads"

collections:
  - name: "blog"
    label: "Blog"
    files:
      - file: "content/blog.json"
        label: "Posts do Blog"
        name: "blog"
        fields:
          - label: "Posts"
            name: "posts"
            widget: "list"
            fields:
              - { label: "Categoria", name: "tag", widget: "string" }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Descrição", name: "description", widget: "text" }

  - name: "noticias"
    label: "Notícias"
    files:
      - file: "content/noticias.json"
        label: "Notícias"
        name: "noticias"
        fields:
          - label: "Itens"
            name: "posts"
            widget: "list"
            fields:
              - { label: "Categoria", name: "tag", widget: "string" }
              - { label: "Título", name: "title", widget: "string" }
